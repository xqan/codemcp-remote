[projects."codemcp-remote"]
root = "D:/Documents/CodexProject/codemcp-remote"
allowed_branches = ["master", "main", "develop", "feature/*", "codex/*"]
require_clean_workspace = true
codemcp_config = "codemcp.toml"

[projects."codemcp-remote".commands.test]
kind = "test"
argv = [
    "/mnt/d/Documents/CodexProject/codemcp-remote/.local/bridge-venv-wsl/bin/python",
    "-m",
    "pytest",
    "-q",
    "bridge/tests",
    "tests/integration",
]
timeout_seconds = 900
approval = "not-required"

[projects."codemcp-remote".commands.format]
kind = "format"
argv = [
    "/mnt/d/Documents/CodexProject/codemcp-remote/.local/bridge-venv-wsl/bin/ruff",
    "format",
    "--check",
    "bridge/src",
    "bridge/tests",
    "tests/integration",
]
timeout_seconds = 300
approval = "not-required"
